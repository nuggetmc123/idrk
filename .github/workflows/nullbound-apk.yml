# Builds the NULLBOUND VR Quest APK (Unity project in nullbound-vr/) and uploads it
# as a downloadable artifact on the workflow run.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL, UNITY_PASSWORD - your Unity account login
#   UNITY_LICENSE               - contents of your Unity license file (.ulf)
# See nullbound-vr/README.md ("Build the APK in GitHub") for how to get them.
name: Build NULLBOUND Quest APK

on:
  push:
    paths:
      - 'nullbound-vr/**'
      - '.github/workflows/nullbound-apk.yml'
  workflow_dispatch:

concurrency:
  group: nullbound-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity secrets
        id: secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD secrets are not set, so the APK can't be built yet. See nullbound-vr/README.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space (the Android Unity image is big)
        if: steps.secrets.outputs.ok == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/cache@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          path: nullbound-vr/Library
          key: nullbound-library-${{ hashFiles('nullbound-vr/Packages/manifest.json', 'nullbound-vr/Assets/**/*.cs') }}
          restore-keys: nullbound-library-

      - name: Build APK with Unity
        if: steps.secrets.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        with:
          projectPath: nullbound-vr
          targetPlatform: Android
          unityVersion: auto
          buildName: Nullbound
          androidExportType: androidPackage
          buildMethod: Nullbound.EditorTools.NBProjectSetup.BuildFromCommandLine

      - name: Upload APK
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nullbound-Quest-APK
          path: build/Android/*.apk
          if-no-files-found: error
