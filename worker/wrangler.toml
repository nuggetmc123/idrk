name = "brawlbound-mp"
main = "index.js"
compatibility_date = "2024-09-23"

# One instance per lobby code — holds that lobby's live WebSocket
# connections, its member list, and relays match traffic once it starts.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyRoom"

# A single always-on instance that acts as a small bulletin board of
# "lobbies looking for more players", for the quick-match / random-people path.
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyRoom", "Directory"]
