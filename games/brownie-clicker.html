<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brownie Clicker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #2b1a12;
    color: #f5e9df;
    min-height: 100vh;
  }
  .layout {
    display: flex;
    min-height: 100vh;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .counter {
    text-align: center;
    margin-top: 10px;
  }
  .counter h1 {
    font-size: 42px;
    margin: 0;
    color: #ffd9a0;
  }
  .counter p {
    margin: 4px 0;
    color: #d9b79c;
    font-size: 15px;
  }
  #brownie-btn {
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 20px;
    transition: transform 0.08s ease;
    outline: none;
  }
  #brownie-btn:active {
    transform: scale(0.92);
  }
  #brownie-svg {
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
  }
  .float-text {
    position: fixed;
    pointer-events: none;
    font-weight: bold;
    color: #ffe1b3;
    font-size: 18px;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 50;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }
  .rebirth-box {
    margin-top: 24px;
    background: #3a2417;
    border: 1px solid #5c3d28;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: center;
    max-width: 320px;
  }
  .rebirth-box h3 {
    margin: 0 0 6px 0;
    color: #ffcf7a;
    font-size: 15px;
  }
  .rebirth-box p {
    margin: 4px 0;
    font-size: 13px;
    color: #d9b79c;
  }
  #rebirth-btn {
    margin-top: 8px;
    background: #7a3b1e;
    color: #ffe9d2;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: bold;
  }
  #rebirth-btn:disabled {
    background: #4a3222;
    color: #8a7462;
    cursor: not-allowed;
  }
  #rebirth-btn:not(:disabled):hover {
    background: #914623;
  }
  .sidebar {
    width: 300px;
    background: #21140d;
    border-left: 1px solid #4a2f1f;
    padding: 14px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .sidebar h2 {
    font-size: 16px;
    text-align: center;
    color: #ffcf7a;
    margin: 4px 0 12px 0;
    border-bottom: 1px solid #4a2f1f;
    padding-bottom: 8px;
  }
  .upgrade {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #2f1c12;
    border: 1px solid #4a2f1f;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .upgrade:hover:not(.disabled) {
    background: #3d2517;
    border-color: #7a4a2c;
  }
  .upgrade.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .upgrade .icon {
    font-size: 26px;
    width: 34px;
    text-align: center;
    flex-shrink: 0;
  }
  .upgrade .info {
    flex: 1;
  }
  .upgrade .info .name {
    font-size: 13px;
    font-weight: bold;
    color: #ffe1b3;
  }
  .upgrade .info .desc {
    font-size: 11px;
    color: #b89a82;
    margin-top: 2px;
  }
  .upgrade .info .stats {
    font-size: 11px;
    color: #d9b79c;
    margin-top: 3px;
  }
  .upgrade .count {
    font-size: 15px;
    font-weight: bold;
    color: #ffcf7a;
    min-width: 22px;
    text-align: right;
  }
  .multiplier-badge {
    text-align: center;
    font-size: 13px;
    color: #9fd68c;
    margin-top: 6px;
  }
  .frenzy-badge {
    text-align: center;
    font-size: 13px;
    color: #ffb347;
    margin-top: 4px;
    font-weight: bold;
    min-height: 18px;
  }
  .golden-brownie {
    position: absolute;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 46px;
    line-height: 1;
    padding: 0;
    filter: drop-shadow(0 0 8px rgba(255, 200, 60, 0.8));
    animation: goldenPulse 1s ease-in-out infinite;
    z-index: 40;
  }
  @keyframes goldenPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .achv-toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #3a2417;
    border: 1px solid #ffcf7a;
    border-radius: 8px;
    padding: 10px 18px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 200;
    max-width: 280px;
  }
  .achv-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .achv-toast .title {
    font-size: 11px;
    color: #ffcf7a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .achv-toast .name {
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    margin-top: 2px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .tab-btn {
    flex: 1;
    background: #2f1c12;
    border: 1px solid #4a2f1f;
    color: #d9b79c;
    padding: 7px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
  }
  .tab-btn.active {
    background: #7a3b1e;
    color: #ffe9d2;
    border-color: #7a4a2c;
  }
  .achv-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #2f1c12;
    border: 1px solid #4a2f1f;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .achv-item.locked {
    opacity: 0.45;
  }
  .achv-item .icon {
    font-size: 22px;
    width: 30px;
    text-align: center;
    flex-shrink: 0;
  }
  .achv-item .name {
    font-size: 13px;
    font-weight: bold;
    color: #ffe1b3;
  }
  .achv-item .desc {
    font-size: 11px;
    color: #b89a82;
    margin-top: 2px;
  }
  .save-controls {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .save-controls button {
    background: #3a2417;
    color: #d9b79c;
    border: 1px solid #5c3d28;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .save-controls button:hover {
    background: #4a2f1e;
  }
  #save-status {
    font-size: 11px;
    color: #9fd68c;
    min-height: 14px;
    margin: 0;
  }
  #save-status.error {
    color: #e88a8a;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="main" style="position: relative;">
    <div class="counter">
      <h1 id="brownie-count">0</h1>
      <p>brownies</p>
      <p id="bps-text">0 brownies/sec</p>
      <p id="click-text">1 per click</p>
      <p id="mult-text" class="multiplier-badge">Multiplier: 1x</p>
      <p id="frenzy-text" class="frenzy-badge"></p>
    </div>

    <button id="brownie-btn">
      <svg id="brownie-svg" width="180" height="180" viewBox="0 0 200 200">
        <rect x="20" y="40" width="160" height="120" rx="14" fill="#5b3421" stroke="#3a2011" stroke-width="4"/>
        <rect x="20" y="40" width="160" height="120" rx="14" fill="none" stroke="#7a4a2c" stroke-width="2"/>
        <circle cx="55" cy="70" r="6" fill="#3a2011"/>
        <circle cx="100" cy="90" r="7" fill="#3a2011"/>
        <circle cx="140" cy="65" r="5" fill="#3a2011"/>
        <circle cx="70" cy="120" r="6" fill="#3a2011"/>
        <circle cx="120" cy="130" r="7" fill="#3a2011"/>
        <circle cx="155" cy="110" r="5" fill="#3a2011"/>
        <circle cx="40" cy="100" r="4" fill="#3a2011"/>
        <circle cx="160" cy="140" r="4" fill="#3a2011"/>
      </svg>
    </button>

    <div class="rebirth-box">
      <h3>Rebirth</h3>
      <p id="rebirth-req">Bake 1,000 brownies to rebirth</p>
      <p id="rebirth-gain">Gain +1x permanent multiplier</p>
      <button id="rebirth-btn">Rebirth</button>
    </div>

    <div class="save-controls">
      <button id="save-btn">Save game</button>
      <button id="reset-btn">Reset game</button>
      <p id="save-status"></p>
    </div>
  </div>

  <div class="sidebar">
    <div class="tabs">
      <button class="tab-btn active" id="tab-shop">Bake Shop</button>
      <button class="tab-btn" id="tab-achv">Achievements</button>
    </div>
    <div id="upgrade-list"></div>
    <div id="achievement-list" style="display:none;"></div>
  </div>
</div>

<div class="achv-toast" id="achv-toast">
  <div class="title">Achievement unlocked</div>
  <div class="name" id="achv-toast-name"></div>
</div>

<script>
(function() {
  var SAVE_KEY = 'brownie-clicker-save';
  var state = {
    brownies: 0,
    totalBaked: 0,
    perClick: 1,
    multiplier: 1,
    totalClicks: 0,
    upgradesBought: 0,
    frenzyEndTime: 0,
    achievementsUnlocked: [],
    upgrades: []
  };

  var upgradeDefs = [
    { id: 'spatula', icon: '🥄', name: 'Extra Spatula', desc: 'A trusty helper stirs the batter.', baseCost: 15, type: 'cps', value: 0.1 },
    { id: 'spoon', icon: '🥢', name: 'Sturdy Spoon', desc: 'A thicker spoon means a harder click.', baseCost: 50, type: 'click', value: 1 },
    { id: 'mixer', icon: '🌀', name: 'Hand Mixer', desc: 'Whips batter faster than you can.', baseCost: 100, type: 'cps', value: 1 },
    { id: 'pan', icon: '🍳', name: 'Non-stick Pan', desc: 'Brownies pop out easier, faster clicks.', baseCost: 400, type: 'click', value: 5 },
    { id: 'grandma', icon: '👵', name: 'Baking Grandma', desc: 'She bakes with love and secret recipes.', baseCost: 500, type: 'cps', value: 6 },
    { id: 'chunks', icon: '🍫', name: 'Chocolate Chunks', desc: 'Extra chunks mean extra weight per click.', baseCost: 2500, type: 'click', value: 25 },
    { id: 'oven', icon: '🔥', name: 'Extra Oven', desc: 'More trays baking at once.', baseCost: 3000, type: 'cps', value: 35 },
    { id: 'scoop', icon: '🍨', name: 'Double Batter Scoop', desc: 'Scoop twice the batter every click.', baseCost: 12000, type: 'click', value: 100 },
    { id: 'kitchen', icon: '🏠', name: 'Bakery Kitchen', desc: 'A whole kitchen devoted to brownies.', baseCost: 15000, type: 'cps', value: 150 },
    { id: 'goldenwhisk', icon: '🪄', name: 'Golden Whisk', desc: 'A magical whisk that empowers your click.', baseCost: 60000, type: 'click', value: 500 },
    { id: 'factory', icon: '🏭', name: 'Brownie Factory', desc: 'Industrial-scale brownie production.', baseCost: 80000, type: 'cps', value: 900 },
    { id: 'diamondspatula', icon: '💎', name: 'Diamond Spatula', desc: 'Flawless clicks, flawless brownies.', baseCost: 350000, type: 'click', value: 2500 },
    { id: 'farm', icon: '🌾', name: 'Cocoa Farm', desc: 'Fresh cocoa straight from the source.', baseCost: 400000, type: 'cps', value: 5000 },
    { id: 'portal', icon: '🌀', name: 'Brownie Portal', desc: 'Summons brownies from another dimension.', baseCost: 2000000, type: 'cps', value: 26000 },
    { id: 'cosmicclicker', icon: '✨', name: 'Cosmic Clicker', desc: 'Your click echoes across dimensions.', baseCost: 2500000, type: 'click', value: 15000 }
  ];

  upgradeDefs.forEach(function(def) {
    state.upgrades.push({ def: def, count: 0 });
  });

  var achievementDefs = [
    { id: 'bite', icon: '🍪', name: 'First Bite', desc: 'Bake your first brownie.', cond: function() { return state.totalBaked >= 1; } },
    { id: 'century', icon: '💯', name: 'Century of Brownies', desc: 'Bake 100 brownies.', cond: function() { return state.totalBaked >= 100; } },
    { id: 'enthusiast', icon: '🧁', name: 'Brownie Enthusiast', desc: 'Bake 10,000 brownies.', cond: function() { return state.totalBaked >= 10000; } },
    { id: 'baron', icon: '🏰', name: 'Brownie Baron', desc: 'Bake 1,000,000 brownies.', cond: function() { return state.totalBaked >= 1000000; } },
    { id: 'tycoon', icon: '👑', name: 'Brownie Tycoon', desc: 'Bake 100,000,000 brownies.', cond: function() { return state.totalBaked >= 100000000; } },
    { id: 'clicknovice', icon: '👆', name: 'Click Novice', desc: 'Click the brownie 100 times.', cond: function() { return state.totalClicks >= 100; } },
    { id: 'clickmaster', icon: '✊', name: 'Click Master', desc: 'Click the brownie 1,000 times.', cond: function() { return state.totalClicks >= 1000; } },
    { id: 'clicklegend', icon: '🖐️', name: 'Click Legend', desc: 'Click the brownie 10,000 times.', cond: function() { return state.totalClicks >= 10000; } },
    { id: 'firstupgrade', icon: '🛒', name: 'First Upgrade', desc: 'Buy your first upgrade.', cond: function() { return state.upgradesBought >= 1; } },
    { id: 'shopregular', icon: '🧺', name: 'Shop Regular', desc: 'Buy 25 upgrades total.', cond: function() { return state.upgradesBought >= 25; } },
    { id: 'shopowner', icon: '🏪', name: 'Shop Owner', desc: 'Buy 100 upgrades total.', cond: function() { return state.upgradesBought >= 100; } },
    { id: 'reborn', icon: '🔄', name: 'Reborn', desc: 'Rebirth for the first time.', cond: function() { return state.multiplier >= 2; } },
    { id: 'multipliermaster', icon: '⭐', name: 'Multiplier Master', desc: 'Reach a 5x multiplier.', cond: function() { return state.multiplier >= 5; } },
    { id: 'goldentouch', icon: '🌟', name: 'Golden Touch', desc: 'Click a golden brownie.', cond: function() { return false; } },
    { id: 'frenzy', icon: '🔥', name: 'Frenzy!', desc: 'Trigger a brownie frenzy.', cond: function() { return false; } }
  ];

  var brownieCountEl = document.getElementById('brownie-count');
  var bpsTextEl = document.getElementById('bps-text');
  var clickTextEl = document.getElementById('click-text');
  var multTextEl = document.getElementById('mult-text');
  var frenzyTextEl = document.getElementById('frenzy-text');
  var upgradeListEl = document.getElementById('upgrade-list');
  var achievementListEl = document.getElementById('achievement-list');
  var rebirthBtn = document.getElementById('rebirth-btn');
  var rebirthReqEl = document.getElementById('rebirth-req');
  var brownieBtn = document.getElementById('brownie-btn');
  var mainEl = document.querySelector('.main');
  var tabShopBtn = document.getElementById('tab-shop');
  var tabAchvBtn = document.getElementById('tab-achv');
  var achvToastEl = document.getElementById('achv-toast');
  var achvToastNameEl = document.getElementById('achv-toast-name');

  tabShopBtn.addEventListener('click', function() {
    tabShopBtn.classList.add('active');
    tabAchvBtn.classList.remove('active');
    upgradeListEl.style.display = '';
    achievementListEl.style.display = 'none';
  });
  tabAchvBtn.addEventListener('click', function() {
    tabAchvBtn.classList.add('active');
    tabShopBtn.classList.remove('active');
    achievementListEl.style.display = '';
    upgradeListEl.style.display = 'none';
  });

  var REBIRTH_THRESHOLD = 1000;

  function serializeState() {
    return JSON.stringify({
      brownies: state.brownies,
      totalBaked: state.totalBaked,
      perClick: state.perClick,
      multiplier: state.multiplier,
      totalClicks: state.totalClicks,
      upgradesBought: state.upgradesBought,
      frenzyEndTime: state.frenzyEndTime,
      achievementsUnlocked: state.achievementsUnlocked,
      counts: state.upgrades.map(function(u) { return u.count; })
    });
  }

  var saveTimeout = null;
  var saveStatusEl = document.getElementById('save-status');

  function setSaveStatus(text, isError) {
    saveStatusEl.textContent = text;
    saveStatusEl.classList.toggle('error', !!isError);
  }

  function hasCloudStorage() {
    return typeof window.storage === 'object' && window.storage &&
      typeof window.storage.set === 'function' && typeof window.storage.get === 'function';
  }

  function hasLocalStorage() {
    try {
      var testKey = '__brownie_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      return true;
    } catch (e) {
      return false;
    }
  }

  function storagePut(key, value) {
    if (hasCloudStorage()) {
      return window.storage.set(key, value, false)
        .then(function(result) { return !!result; })
        .catch(function() {
          return hasLocalStorage() ? (localStorage.setItem(key, value), true) : false;
        });
    }
    if (hasLocalStorage()) {
      try {
        localStorage.setItem(key, value);
        return Promise.resolve(true);
      } catch (e) {
        return Promise.resolve(false);
      }
    }
    return Promise.resolve(false);
  }

  function storageFetch(key) {
    if (hasCloudStorage()) {
      return window.storage.get(key, false)
        .then(function(result) { return result ? result.value : null; })
        .catch(function() {
          return hasLocalStorage() ? localStorage.getItem(key) : null;
        });
    }
    if (hasLocalStorage()) {
      return Promise.resolve(localStorage.getItem(key));
    }
    return Promise.resolve(null);
  }

  function saveGameNow() {
    setSaveStatus('Saving…');
    return storagePut(SAVE_KEY, serializeState()).then(function(ok) {
      if (ok) {
        setSaveStatus(hasCloudStorage() ? 'Saved just now' : 'Saved to this browser');
      } else {
        setSaveStatus('Save failed - try again', true);
      }
      return ok;
    });
  }

  function saveGame() {
    clearTimeout(saveTimeout);
    setSaveStatus('Saving…');
    saveTimeout = setTimeout(saveGameNow, 500);
  }

  async function loadGame() {
    setSaveStatus('Loading save…');
    try {
      var value = await storageFetch(SAVE_KEY);
      if (value) {
        var data = JSON.parse(value);
        state.brownies = data.brownies || 0;
        state.totalBaked = data.totalBaked || 0;
        state.perClick = data.perClick || 1;
        state.multiplier = data.multiplier || 1;
        state.totalClicks = data.totalClicks || 0;
        state.upgradesBought = data.upgradesBought || 0;
        state.frenzyEndTime = data.frenzyEndTime || 0;
        state.achievementsUnlocked = Array.isArray(data.achievementsUnlocked) ? data.achievementsUnlocked : [];
        if (Array.isArray(data.counts)) {
          data.counts.forEach(function(c, i) {
            if (state.upgrades[i]) state.upgrades[i].count = c || 0;
          });
        }
        setSaveStatus('Save loaded');
      } else if (hasCloudStorage() || hasLocalStorage()) {
        setSaveStatus('No save found yet - starting fresh');
      } else {
        setSaveStatus('Saving not available in this browser', true);
      }
    } catch (err) {
      console.log('No save found or load failed:', err);
      setSaveStatus('No save found yet - starting fresh');
    }
    renderAll();
    scheduleGolden();
  }

  function formatNum(n) {
    n = Math.floor(n);
    if (n < 1000) return n.toString();
    var units = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
    var i = 0;
    var val = n;
    while (val >= 1000 && i < units.length - 1) {
      val /= 1000;
      i++;
    }
    return val.toFixed(val < 10 ? 2 : 1) + units[i];
  }

  function costFor(upg) {
    return Math.ceil(upg.def.baseCost * Math.pow(1.15, upg.count));
  }

  function frenzyMultiplier() {
    return Date.now() < state.frenzyEndTime ? 2 : 1;
  }

  function totalCps() {
    var sum = 0;
    state.upgrades.forEach(function(u) {
      if (u.def.type === 'cps') sum += u.def.value * u.count;
    });
    return sum * state.multiplier * frenzyMultiplier();
  }

  function totalPerClick() {
    var base = state.perClick;
    state.upgrades.forEach(function(u) {
      if (u.def.type === 'click') base += u.def.value * u.count;
    });
    return base;
  }

  function nextRebirthThreshold() {
    return REBIRTH_THRESHOLD * Math.pow(2, state.multiplier - 1);
  }

  function renderUpgrades() {
    upgradeListEl.innerHTML = '';
    state.upgrades.forEach(function(u) {
      var cost = costFor(u);
      var affordable = state.brownies >= cost;
      var statLabel = u.def.type === 'click'
        ? '+' + formatNum(u.def.value) + ' per click each'
        : '+' + formatNum(u.def.value) + '/sec each';
      var row = document.createElement('div');
      row.className = 'upgrade' + (affordable ? '' : ' disabled');
      row.innerHTML =
        '<div class="icon">' + u.def.icon + '</div>' +
        '<div class="info">' +
          '<div class="name">' + u.def.name + '</div>' +
          '<div class="desc">' + u.def.desc + '</div>' +
          '<div class="stats">Cost: ' + formatNum(cost) + ' &middot; ' + statLabel + '</div>' +
        '</div>' +
        '<div class="count">' + u.count + '</div>';
      row.addEventListener('click', function() {
        buyUpgrade(u);
      });
      upgradeListEl.appendChild(row);
    });
  }

  function buyUpgrade(u) {
    var cost = costFor(u);
    if (state.brownies >= cost) {
      state.brownies -= cost;
      u.count++;
      state.upgradesBought++;
      renderAll();
    }
  }

  function renderAchievements() {
    achievementListEl.innerHTML = '';
    var unlockedCount = state.achievementsUnlocked.length;
    var heading = document.createElement('div');
    heading.style.fontSize = '12px';
    heading.style.color = '#d9b79c';
    heading.style.textAlign = 'center';
    heading.style.marginBottom = '10px';
    heading.textContent = unlockedCount + ' / ' + achievementDefs.length + ' unlocked';
    achievementListEl.appendChild(heading);

    achievementDefs.forEach(function(a) {
      var unlocked = state.achievementsUnlocked.indexOf(a.id) !== -1;
      var item = document.createElement('div');
      item.className = 'achv-item' + (unlocked ? '' : ' locked');
      item.innerHTML =
        '<div class="icon">' + (unlocked ? a.icon : '🔒') + '</div>' +
        '<div>' +
          '<div class="name">' + (unlocked ? a.name : '???') + '</div>' +
          '<div class="desc">' + (unlocked ? a.desc : 'Keep baking to unlock.') + '</div>' +
        '</div>';
      achievementListEl.appendChild(item);
    });
  }

  function unlockAchievement(id) {
    if (state.achievementsUnlocked.indexOf(id) !== -1) return;
    state.achievementsUnlocked.push(id);
    var def = achievementDefs.filter(function(a) { return a.id === id; })[0];
    if (def) showAchievementToast(def.icon + ' ' + def.name);
  }

  function checkAchievements() {
    achievementDefs.forEach(function(a) {
      if (state.achievementsUnlocked.indexOf(a.id) === -1 && a.cond()) {
        unlockAchievement(a.id);
      }
    });
  }

  var toastTimeout = null;
  function showAchievementToast(text) {
    achvToastNameEl.textContent = text;
    achvToastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function() {
      achvToastEl.classList.remove('show');
    }, 3200);
  }

  function renderAll() {
    brownieCountEl.textContent = formatNum(state.brownies);
    bpsTextEl.textContent = formatNum(totalCps()) + ' brownies/sec';
    clickTextEl.textContent = formatNum(totalPerClick() * state.multiplier * frenzyMultiplier()) + ' per click';
    multTextEl.textContent = 'Multiplier: ' + state.multiplier + 'x';

    if (Date.now() < state.frenzyEndTime) {
      var secsLeft = Math.ceil((state.frenzyEndTime - Date.now()) / 1000);
      frenzyTextEl.textContent = '🔥 Frenzy active! x2 for ' + secsLeft + 's';
    } else {
      frenzyTextEl.textContent = '';
    }

    renderUpgrades();
    renderAchievements();
    checkAchievements();

    var threshold = nextRebirthThreshold();
    rebirthReqEl.textContent = state.totalBaked >= threshold
      ? 'Ready to rebirth!'
      : 'Bake ' + formatNum(threshold) + ' total brownies to rebirth (progress: ' + formatNum(state.totalBaked) + ')';
    rebirthBtn.disabled = state.totalBaked < threshold;
    saveGame();
  }

  function addBrownies(amount) {
    state.brownies += amount;
    state.totalBaked += amount;
  }

  brownieBtn.addEventListener('click', function(e) {
    var gain = totalPerClick() * state.multiplier * frenzyMultiplier();
    addBrownies(gain);
    state.totalClicks++;
    renderAll();
    spawnFloatText(e.clientX, e.clientY, '+' + formatNum(gain));
  });

  function spawnFloatText(x, y, text) {
    var el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = (x - 10) + 'px';
    el.style.top = (y - 10) + 'px';
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 900);
  }

  rebirthBtn.addEventListener('click', function() {
    var threshold = nextRebirthThreshold();
    if (state.totalBaked >= threshold) {
      state.multiplier += 1;
      state.brownies = 0;
      state.totalBaked = 0;
      state.upgrades.forEach(function(u) { u.count = 0; });
      renderAll();
    }
  });

  var goldenActive = false;
  function scheduleGolden() {
    var delay = 4 * 60 * 1000 + Math.random() * 2 * 60 * 1000;
    setTimeout(function() {
      spawnGoldenBrownie();
      scheduleGolden();
    }, delay);
  }

  function spawnGoldenBrownie() {
    if (goldenActive) return;
    goldenActive = true;
    var el = document.createElement('button');
    el.className = 'golden-brownie';
    el.textContent = '🟤✨';
    var bounds = mainEl.getBoundingClientRect();
    var top = 20 + Math.random() * Math.max(40, bounds.height - 120);
    var left = 20 + Math.random() * Math.max(40, bounds.width - 80);
    el.style.top = top + 'px';
    el.style.left = left + 'px';

    var removed = false;
    function remove() {
      if (removed) return;
      removed = true;
      goldenActive = false;
      if (el.parentNode) el.parentNode.removeChild(el);
    }

    el.addEventListener('click', function(e) {
      e.stopPropagation();
      triggerGoldenEffect(e.clientX, e.clientY);
      remove();
    });

    mainEl.appendChild(el);
    setTimeout(remove, 13000);
  }

  function triggerGoldenEffect(x, y) {
    unlockAchievement('goldentouch');
    if (Math.random() < 0.5) {
      var amount = Math.round(Math.max(150, totalCps() * 45 + totalPerClick() * 20));
      addBrownies(amount);
      spawnFloatText(x, y, 'Brownie Burst! +' + formatNum(amount));
    } else {
      state.frenzyEndTime = Date.now() + (30 + Math.random() * 30) * 1000;
      unlockAchievement('frenzy');
      spawnFloatText(x, y, '🔥 Frenzy! x2');
    }
    renderAll();
  }

  setInterval(function() {
    var cps = totalCps();
    if (cps > 0) {
      addBrownies(cps / 10);
      renderAll();
    }
  }, 100);

  setInterval(function() {
    if (Date.now() < state.frenzyEndTime) {
      var secsLeft = Math.ceil((state.frenzyEndTime - Date.now()) / 1000);
      frenzyTextEl.textContent = '🔥 Frenzy active! x2 for ' + secsLeft + 's';
      bpsTextEl.textContent = formatNum(totalCps()) + ' brownies/sec';
      clickTextEl.textContent = formatNum(totalPerClick() * state.multiplier * frenzyMultiplier()) + ' per click';
    } else if (frenzyTextEl.textContent) {
      frenzyTextEl.textContent = '';
      renderAll();
    }
  }, 1000);

  var saveBtn = document.getElementById('save-btn');
  var resetBtn = document.getElementById('reset-btn');

  saveBtn.addEventListener('click', function() {
    clearTimeout(saveTimeout);
    setSaveStatus('Saving…');
    saveGameNow();
  });

  resetBtn.addEventListener('click', function() {
    if (!confirm('Reset all progress? This cannot be undone.')) return;
    state.brownies = 0;
    state.totalBaked = 0;
    state.perClick = 1;
    state.multiplier = 1;
    state.totalClicks = 0;
    state.upgradesBought = 0;
    state.frenzyEndTime = 0;
    state.achievementsUnlocked = [];
    state.upgrades.forEach(function(u) { u.count = 0; });
    renderAll();
    setSaveStatus('Progress reset');
  });

  window.addEventListener('beforeunload', function() {
    clearTimeout(saveTimeout);
    saveGameNow();
  });

  loadGame();
})();
</script>

</body>
</html>
